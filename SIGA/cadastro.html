<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar - SIGA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>SIGA</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="gerenciar.html">Inventário</a>
        <a href="escalas.html">Escalas</a>
        <a href="monitoramento.html">Monitoramento</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastrar</a>
    </nav>

</header>

<main>

    <div class="caixa">

        <h2>Cadastro de Instituição</h2>

        <img src="imagens/cadastro.jpg" alt="Cadastro de instituição">

        <p>
            Registre sua instituição de segurança para começar a usar o SIGA.
        </p>

        <form>

            <label>Nome da instituição:</label>
            <input type="text">

            <label>Tipo de instituição:</label>
            <select>
                <option>Exército</option>
                <option>Polícia Militar</option>
                <option>Polícia Civil</option>
                <option>Segurança Privada</option>
                <option>Órgão de Controle e Defesa</option>
            </select>

            <label>Responsável técnico:</label>
            <input type="text">

            <label>Matrícula funcional:</label>
            <input type="text">

            <label>E-mail institucional:</label>
            <input type="email">

            <label>Senha:</label>
            <input type="password">

            <button type="submit">Criar cadastro</button>

        </form>

        <p>
            Já possui cadastro?
            <a href="login.html">Fazer login</a>
        </p>

    </div>

</main>

<footer>
    <p>SIGA - Projeto acadêmico</p>
</footer>

</body>
</html>
