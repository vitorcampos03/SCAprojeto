<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Item - SCA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h1>SCA</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="gerenciar.html">Inventário</a>
        <a href="escalas.html">Escalas</a>
        <a href="monitoramento.html">Monitoramento</a>
        <a href="login.html">Login</a>
        <a href="cadastro.html">Cadastrar</a>
    </nav>

</header>

<main>

    <div class="caixa">

        <h2 id="titulo">Novo Item do Inventário</h2>

        <p id="subtitulo">
            Preencha os dados do equipamento.
        </p>

        <form id="form-item">

            <label for="codigo">Código:</label>
            <input type="text" id="codigo" required maxlength="30">

            <label for="modelo">Modelo:</label>
            <input type="text" id="modelo" required maxlength="100">

            <label for="unidade">Unidade responsável:</label>
            <input type="text" id="unidade" required maxlength="100">

            <label for="status">Status:</label>
            <select id="status">
                <option>Disponível</option>
                <option>Em uso</option>
                <option>Manutenção</option>
            </select>

            <button type="submit" id="botao-salvar">Salvar</button>

        </form>

    </div>

</main>

<footer>
    <p>SCA - Projeto acadêmico</p>
</footer>

<script src="editar.js"></script>

</body>
</html>
